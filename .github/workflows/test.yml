name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The compiler's giant match functions (whnf/nf ~990 arms, shift/subst
    # ~340) exceed Racket CS's default compile limit of 10000 and fall back to
    # the INTERPRETER. `tools/run-affected-tests.rkt` and `tools/bench-ab.rkt`
    # putenv this for themselves, but a bare `raco make` -- which is how CI
    # precompiles -- does not, and the .zo it produces is interpreted for the
    # rest of the job.
    #
    # This is not a micro-optimisation here. The OCapN interop gate failed on
    # CI with 14 passed / 1 errored while passing 17/17 locally; rebuilding
    # locally WITHOUT the limit reproduced 14/1 exactly. Upstream's tests carry
    # their own wall-clock budgets (15s for a GC round trip), so interpreted
    # reduction does not merely run slow, it fails.
    env:
      PLT_CS_COMPILE_LIMIT: 1000000
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: '9.0'

      # Node + @endo/ocapn are required by the OCapN interop tests
      # (bridge-interop, handshake, conversation, rpc, pipelined,
      # abort, live-interop, syrup-cross-impl). The tests hard-fail
      # if these deps are missing rather than skipping silently —
      # see racket/prologos/tests/test-ocapn-*.rkt's
      # `(unless (interop-deps-present?) (error ...))` guards.
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS interop deps (@endo/ocapn + @endo/init)
        run: |
          cd tools/interop
          npm install --no-audit --no-fund

      - name: Install dependencies
        run: cd racket/prologos && raco pkg install --auto --skip-installed

      - name: Pre-compile modules
        run: cd racket/prologos && raco make driver.rkt

      - name: "Run full test suite (skipped: heavy reduction perf tests)"
        # --file-timeout: the 120s default was set when "slowest normal tests
        # ~17s". The OCapN bridge tests legitimately cost far more — each one
        # elaborates the whole OCapN module chain — and that cost is per FILE,
        # so a GitHub runner exceeds 120s on it. (Splitting the file made it
        # WORSE: the fixed cost got paid twice and BOTH halves timed out.)
        run: cd racket/prologos && racket tools/run-affected-tests.rkt --all --no-record --file-timeout 300
